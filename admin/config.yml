backend:
  name: github
  repo: your_username/your_repo_name # 替换为您的GitHub用户名和仓库名
  branch: main # 或者您的主分支名称

media_folder: "static/img"
public_folder: "/static/img"

collections:
  - name: "config"
    label: "Site Configuration"
    files:
      - label: "Site Settings"
        name: "settings"
        file: "content/site-settings.json"
        fields:
          - {label: "Site Title", name: "siteTitle", widget: "string"}
          - {label: "Logo Image", name: "logoImage", widget: "image"}
          - {label: "Footer Text", name: "footerText", widget: "string"}
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        fields:
          - {label: "Welcome Text", name: "welcome", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Social Links"
            name: "socialLinks"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}