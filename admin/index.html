<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  <script>
    // 简单的密码验证
    var password = "123123"; // 替换为您的密码
    if (localStorage.getItem('cms_password') !== password) {
      var input = prompt("请输入后台管理密码:");
      if (input === password) {
        localStorage.setItem('cms_password', input);
      } else {
        alert("密码错误！");
        window.location.href = "/";
      }
    }
  </script>
</body>
</html>
