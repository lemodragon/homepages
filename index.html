<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title id="siteTitle">薰衣草Pub</title>
    <link rel="icon" href="/static/img/favicon.ico">
    <meta name="description" content="整天半吊子和不学无术的坏孩子,梦想成为庄稼地里的读书人.....">
    <meta name="keywords" content="zyyo,张扬YO,ZYYO,张扬主页,ZYYO引导页,zhangyang">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/root.css">
    <style>
        #zyyo-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #zyyo-loading-center {
            width: 50px;
            height: 50px;
            background-color: #6c5ce7;
            border-radius: 50%;
            animation: bounce 0.5s alternate infinite;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
        .zyyo-main {
            display: none;
        }
    </style>
</head>
<body>
    <div id="zyyo-loading">
        <div id="zyyo-loading-center"></div>
    </div>
    <div class="zyyo-filter"></div>

    <div class="zyyo-main">
        <div class="zyyo-left">
            <div id="siteLogo" class="logo">
                <img style="position: absolute;top:-15%;left:-10%;width: 120%; aspect-ratio: 1/1;" src="/static/img/logokuang.png">
            </div>
            <div class="left-div left-des">
                <div class="left-des-item">
                    <svg t="1705773709627" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1478">
                        <path d="M512 249.976471c-99.388235 0-180.705882 81.317647-180.705882 180.705882s81.317647 180.705882 180.705882 180.705882 180.705882-81.317647 180.705882-180.705882-81.317647-180.705882-180.705882-180.705882z m0 301.17647c-66.258824 0-120.470588-54.211765-120.470588-120.470588s54.211765-120.470588 120.470588-120.470588 120.470588 54.211765 120.470588 120.470588-54.211765 120.470588-120.470588 120.470588z" p-id="1479"></path>
                        <path d="M512 39.152941c-216.847059 0-391.529412 174.682353-391.529412 391.529412 0 349.364706 391.529412 572.235294 391.529412 572.235294s391.529412-222.870588 391.529412-572.235294c0-216.847059-174.682353-391.529412-391.529412-391.529412z m0 891.482353C424.658824 873.411765 180.705882 686.682353 180.705882 430.682353c0-183.717647 147.576471-331.294118 331.294118-331.294118s331.294118 147.576471 331.294118 331.294118c0 256-243.952941 442.729412-331.294118 499.952941z" p-id="1480"></path>
                    </svg>China-Henan
                </div>
                <div class="left-des-item">
                    <svg t="1705773906032" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2474">
                        <path d="M729.6 234.666667H294.4V157.866667a51.2 51.2 0 0 1 51.2-51.2h332.8a51.2 51.2 0 0 1 51.2 51.2v76.8z m179.2 51.2a51.2 51.2 0 0 1 51.2 51.2v512a51.2 51.2 0 0 1-51.2 51.2H115.2a51.2 51.2 0 0 1-51.2-51.2v-512a51.2 51.2 0 0 1 51.2-51.2h793.557333z m-768 172.032c0 16.384 13.312 29.696 29.696 29.696h683.008a29.696 29.696 0 1 0 0-59.392H170.410667a29.696 29.696 0 0 0-29.696 29.696z m252.416 118.784c0 16.384 13.312 29.696 29.696 29.696h178.176a29.696 29.696 0 1 0 0-59.392H422.912a29.738667 29.738667 0 0 0-29.696 29.696z" p-id="2475"></path>
                    </svg>Sias
                </div>
            </div>
            <div id="leftTags" class="left-div left-tag">
                <!-- Tags will be dynamically added here -->
            </div>
            <div class="left-div left-time">
                <ul id="line">
                    <!-- Timeline will be dynamically added here -->
                </ul>
            </div>
        </div>
        <div class="zyyo-right">
            <header>
                <div class="index-logo" style="background-image: url(/static/img/logo.png);">
                    <img style="position: absolute;top:-15%;left:-10%;width: 120%; aspect-ratio: 1/1;" src="/static/img/logokuang.png">
                </div>
                <div id="welcomeText" class="welcome"></div>
                <div id="description" class="description"></div>
                <div id="socialLinks" class="iconContainer"></div>
                <div class="tanChiShe">
                    <img id="tanChiShe" src="/static/svg/snake-Light.svg" alt="">
                </div>
            </header>
            <content>
                <div class="title">
                    <svg t="1705257422086" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1891">
                        <path d="M629.333333 202.666667v213.333333h277.333334v448h-512v-213.333333h-277.333334v-448h512z m213.333334 277.333333h-213.333334v170.666667h-170.666666v149.333333h384v-320z m-277.333334-213.333333h-384v320h213.333334v-170.666667h170.666666v-149.333333z m0 213.333333h-106.666666v106.666667h106.666666v-106.666667z" p-id="1892"></path>
                    </svg>project 
                </div>
                <div id="projectList" class="projectList"></div>
            </content>
        </div>
    </div>

    <footer id="siteFooter">
        <!-- Footer content will be dynamically added here -->
    </footer>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        function hideLoading() {
            document.getElementById('zyyo-loading').style.display = 'none';
        }

        function showContent() {
            document.querySelector('.zyyo-main').style.display = 'flex';
        }

        // 设置一个超时，10秒后强制隐藏加载动画
        setTimeout(() => {
            hideLoading();
            showContent();
        }, 10000);

        let settingsLoaded = false;
        let homeContentLoaded = false;

        function checkAllLoaded() {
            if (settingsLoaded && homeContentLoaded) {
                hideLoading();
                showContent();
            }
        }

        // Load site settings
        axios.get('/content/site-settings.json')
            .then(function (response) {
                const settings = response.data;
                document.getElementById('siteTitle').textContent = settings.siteTitle;
                document.getElementById('siteLogo').style.backgroundImage = `url(${settings.logoImage})`;
                document.getElementById('siteFooter').innerHTML = settings.footerText;

                // Add tags
                let tagsHtml = '';
                if (settings.tags && Array.isArray(settings.tags)) {
                    settings.tags.forEach(tag => {
                        tagsHtml += `<div class="left-tag-item">${tag}</div>`;
                    });
                }
                document.getElementById('leftTags').innerHTML = tagsHtml;

                // Add timeline
                let timelineHtml = '';
                if (settings.timeline && Array.isArray(settings.timeline)) {
                    settings.timeline.forEach(item => {
                        timelineHtml += `
                            <li>
                                <div class="focus"></div>
                                <div>${item.event}</div>
                                <div>${item.date}</div>
                            </li>`;
                    });
                }
                document.getElementById('line').innerHTML = timelineHtml;

                settingsLoaded = true;
                checkAllLoaded();
            })
            .catch(function (error) {
                console.error('Error loading site settings:', error);
                settingsLoaded = true;
                checkAllLoaded();
            });

        // Load home content
        axios.get('/content/home.json')
            .then(function (response) {
                const data = response.data;
                
                // Set welcome text
                document.getElementById('welcomeText').innerHTML = `Hello I'm <span class="gradientText">${data.welcome}</span>`;
                
                // Set description
                document.getElementById('description').innerHTML = data.description;
                
                // Set social links
                let socialLinksHtml = '';
                if (data.socialLinks && Array.isArray(data.socialLinks)) {
                    data.socialLinks.forEach(link => {
                        socialLinksHtml += `
                            <a class="iconItem" href="${link.url}" target="_blank">
                                <svg class="icon" viewBox="0 0 1024 1024">
                                    <!-- SVG path should be placed here -->
                                </svg>
                                <div class="iconTip">${link.name}</div>
                            </a>`;
                    });
                }
                document.getElementById('socialLinks').innerHTML = socialLinksHtml;

                // Set project list
                let projectsHtml = '';
                if (data.projects && Array.isArray(data.projects)) {
                    data.projects.forEach(project => {
                        projectsHtml += `
                            <a class="projectItem b" target="_blank" href="${project.url}">
                                <div class="projectItemLeft">
                                    <h1>${project.title}</h1>
                                    <p>${project.description}</p>
                                </div>
                                <div class="projectItemRight">
                                    <img src="${project.image}" alt="${project.title}">
                                </div>
                            </a>`;
                    });
                }
                document.getElementById('projectList').innerHTML = projectsHtml;

                homeContentLoaded = true;
                checkAllLoaded();
            })
            .catch(function (error) {
                console.error('Error loading home content:', error);
                homeContentLoaded = true;
                checkAllLoaded();
            });
    </script>

    <script src="/static/js/script.js"></script>
</body>
</html>
